# Render blueprint — deploys the Moonrat API + a managed Postgres database together.
# In Render: New → Blueprint → pick the IceBox247/MoonRat repo → Apply.
# Then set the secret env vars marked `sync: false` (ADMIN_PASSWORD, etc.) in the dashboard.

databases:
  - name: moonrat-db
    databaseName: moonrat
    plan: free

services:
  - type: web
    name: moonrat-api
    runtime: node
    plan: free
    rootDir: server
    # --include=dev so the build tools (prisma, tsc) are available on the host.
    buildCommand: npm install --include=dev && npm run build:prod
    # Sync schema + seed at runtime (DB is guaranteed up), then start the API.
    startCommand: npm run predeploy:prod && npm run start:prod
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: moonrat-db
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_JWT_SECRET
        generateValue: true
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false # set this yourself in the dashboard
      # Keep dev-auth ON until a Telegram bot token is set, so the app is testable
      # in a plain browser. Turn OFF (and set TELEGRAM_BOT_TOKEN) for production Telegram.
      - key: ALLOW_DEV_AUTH
        value: "true"
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      # Balances are mocked until you provide the $MOONRAT jetton master address.
      - key: TON_BALANCE_PROVIDER
        value: mock
      - key: MOONRAT_JETTON_MASTER
        sync: false
      - key: MOONRAT_JETTON_DECIMALS
        value: "9"
      - key: MOONRAT_BUY_URL
        value: https://app.ston.fi/swap
      # Tighten this to your Vercel domain once the frontend is deployed.
      - key: CORS_ORIGINS
        value: "*"
